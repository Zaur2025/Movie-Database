version: '3.8'

services:
  # Сервис 1: База данных PostgreSQL
  postgres:
    image: postgres:15-alpine  # ← Маленький образ PostgreSQL
    container_name: postgres  # ← container_name для consistency
    environment:               # ← Переменные окружения
      - POSTGRES_DB=moviedb    # Имя базы данных
      - POSTGRES_USER=postgres # Пользователь
      - POSTGRES_PASSWORD=postgres # Пароль
    ports:
      - "5432:5432"           # Порт хоста:порт контейнера
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Сохраняем данные
    healthcheck:  # ← Добавляем healthcheck (Это гарантирует, что приложение запустится только когда БД готова)
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      
      # Сервис 2: Брокер сообщений RabbitMQ
  rabbitmq:  # ← ОТСТУП ТАКОЙ ЖЕ КАК У postgres: (2 пробела)
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    # Опционально: healthcheck для RabbitMQ
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      
  # Сервис 3: Моё приложение Movie-Database
  movie-api:
    build: .                  # ← Собираем из текущей папки (Dockerfile)
    ports:
      - "8080:8080"           # Публикуем порт
    environment: # ← Эти переменные ПЕРЕОПРЕДЕЛЯТ значения из application.properties
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/moviedb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      postgres:
        condition: service_healthy  # ← Ждём пока БД станет healthy
      rabbitmq:
        condition: service_started  # ← Запускать ПОСЛЕ postgres и rabbitmq

# Тома для сохранения данных
volumes:
  postgres_data:              # Именованный том для данных БД